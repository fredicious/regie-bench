<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskboard</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Régie Bench</p>
        <h1>Taskboard</h1>
        <p>Small tasks, clearly finished.</p>
      </header>

      <form id="new-task" class="composer">
        <label for="task-title">What needs doing?</label>
        <div class="composer-row">
          <input id="task-title" name="title" autocomplete="off" required>
          <button type="submit">Add task</button>
        </div>
      </form>

      <nav class="filters" aria-label="Task filters">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </nav>

      <section aria-labelledby="task-list-heading">
        <h2 id="task-list-heading" class="sr-only">Tasks</h2>
        <div id="task-list"></div>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
